name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Runs before the build because the build cannot catch this class of bug:
      # a call to an identifier that no longer exists compiles fine and only
      # throws in the browser, where it blanks the page.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The production image is the actual deployment artifact, so a broken
      # build should fail here rather than on Railway.
      - name: Build image
        run: docker build -t website-monitor:ci .

      # The droplet deployment's compose file and Caddyfile, checked before a
      # server tries to start them.
      - name: Validate docker-compose.yml and Caddyfile
        run: |
          cp .env.production.example .env
          docker compose config --quiet
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=:80 caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
